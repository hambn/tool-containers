# docker stack deploy -c stack.yml agentbloat
version: "3.8"

services:
  agentbloat:
    image: ghcr.io/hambn/agentbloat:latest
    command: ["sleep", "infinity"]
    networks: [agentbloat]
    volumes:
      - workspace:/workspace
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

networks:
  agentbloat:
    driver: overlay
    name: agentbloat

volumes:
  workspace:
