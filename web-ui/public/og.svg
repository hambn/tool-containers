<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="tool-containers">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#27272a" />
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.35" />
    </linearGradient>
    <mask id="dotMask">
      <rect x="0" y="0" width="1200" height="630" fill="url(#fade)" />
    </mask>
  </defs>

  <rect x="0" y="0" width="1200" height="630" fill="#09090b" />
  <rect x="0" y="0" width="1200" height="630" fill="url(#dots)" mask="url(#dotMask)" />

  <rect x="120" y="140" width="96" height="96" rx="19" ry="19" fill="#18181b" stroke="#27272a" stroke-width="1" />
  <text x="168" y="200" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="40" font-weight="700" fill="#fafafa">&gt;_</text>

  <text x="120" y="330" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="76" font-weight="700" letter-spacing="-2" fill="#fafafa">tool-containers</text>

  <text x="120" y="380" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" fill="#a1a1aa">Container images for AI agents, CI and sandboxes</text>

  <rect x="120" y="470" width="80" height="4" rx="2" fill="#3f3f46" />

  <rect x="0" y="626" width="1200" height="4" fill="#18181b" />
</svg>
