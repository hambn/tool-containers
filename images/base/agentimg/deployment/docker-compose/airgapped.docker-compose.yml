# docker compose -f airgapped.docker-compose.yml run --rm agentimg
name: agentimg-airgapped

services:
  agentimg:
    build:
      context: ../../images/ubuntu-browser
    image: local/agentimg:ubuntu-browser
    pull_policy: never
    command: ["zsh", "-l"]
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    stdin_open: true
    tty: true
    networks: [agentimg]

networks:
  agentimg:
    name: agentimg-airgapped
