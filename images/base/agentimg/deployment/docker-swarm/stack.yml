# docker stack deploy -c stack.yml agentimg
version: "3.8"

services:
  agentimg:
    image: ghcr.io/hambn/agentimg:latest
    command: ["sleep", "infinity"]
    networks: [agentimg]
    volumes:
      - workspace:/workspace
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

networks:
  agentimg:
    driver: overlay
    name: agentimg

volumes:
  workspace:
