# WORKSPACE="$PWD" ./compose.sh run --rm agentbloat
name: agentbloat

services:
  agentbloat:
    image: ${AGENTBLOAT_IMAGE:-ghcr.io/hambn/agentbloat:latest}
    command: ["zsh", "-l"]
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    stdin_open: true
    tty: true
    networks: [agentbloat]

networks:
  agentbloat:
    name: agentbloat
