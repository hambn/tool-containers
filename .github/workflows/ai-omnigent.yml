name: ai/omnigent

on:
  pull_request:
    paths: &paths
      - "tools/ai/omnigent/**"
      - "tools/trivyignore.yaml"
      - ".github/workflows/ai-omnigent.yml"
      - ".github/workflows/tool-image.yml"
  push:
    branches: [main]
    paths: *paths
  # Daily check: rebuilds variants whose parent moved or whose published image has
  # fixable OS vulnerabilities.
  schedule:
    - cron: "50 6 * * *"
  # The parent's workflow dispatches this one with outdated-only after publishing.
  workflow_dispatch:
    inputs:
      outdated-only:
        description: Only rebuild variants whose parent moved or that have fixable OS vulnerabilities.
        type: boolean
        default: false

concurrency:
  group: ai-omnigent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  image:
    name: omnigent
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      actions: write
    uses: ./.github/workflows/tool-image.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      tool: tools/ai/omnigent
      primary: ubuntu-browser
      version-arg: OMNIGENT_VERSION
      outdated-only: ${{ inputs.outdated-only || false }}
