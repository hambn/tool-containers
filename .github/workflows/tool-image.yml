name: tool-image

# Python scripts own job logic; this file owns the matrices, actions and permissions.
# Build jobs produce tested per-architecture digests. Each registry publishes complete
# architecture pairs, even when an unrelated variant fails.
# Scheduled/outdated-only runs select moved parents and fixable OS vulnerabilities.
on:
  workflow_call:
    inputs:
      tool:
        description: Tool directory, e.g. tools/ai/claude-code.
        required: true
        type: string
      latest-variant:
        description: Variant that owns latest and the optional version tag.
        required: true
        type: string
      version-prefix:
        description: Prefix of the version tag on latest-variant, e.g. t3code.
        required: false
        default: ""
        type: string
      version-arg:
        description: >-
          Dockerfile ARG holding the upstream version (e.g. CLAUDE_CODE_VERSION),
          used for the version tag and the image version label.
        required: false
        default: ""
        type: string
      outdated-only:
        description: Only rebuild outdated variants, as scheduled runs do.
        required: false
        default: false
        type: boolean
      dependents:
        description: Space-separated workflow files to dispatch after publishing.
        required: false
        default: ""
        type: string
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions: {}

env:
  GHCR: ghcr.io/hambn
  CACHE: ghcr.io/hambn/buildcache
  # renovate: datasource=github-releases depName=docker/buildx
  BUILDX_VERSION: v0.35.0
  # renovate: datasource=docker depName=moby/buildkit
  BUILDKIT_IMAGE: moby/buildkit:v0.32.2@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      image: ${{ steps.plan.outputs.image }}
      version: ${{ steps.plan.outputs.version }}
      variants: ${{ steps.plan.outputs.variants }}
      builds: ${{ steps.plan.outputs.builds }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker # Only reads bake files and registry manifests.
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        if: github.event_name == 'schedule' || inputs.outdated-only
        with:
          version: v0.70.0
          cache: true

      - name: Pick variants
        id: plan
        env:
          TOOL: ${{ inputs.tool }}
          VERSION_ARG: ${{ inputs.version-arg }}
          OUTDATED_ONLY: ${{ github.event_name == 'schedule' || inputs.outdated-only }}
        run: python3 .github/scripts/plan.py

  build:
    name: ${{ matrix.variant }} (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.variants != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # Push digests and the build cache on main.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.builds) }}
    env:
      TOOL: ${{ inputs.tool }}
      IMAGE: ${{ needs.plan.outputs.image }}
      VERSION: ${{ needs.plan.outputs.version }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      TARGET: ${{ matrix.target }}
      BASE: ${{ matrix.base }}
      ARCH: ${{ matrix.arch }}
      DISTRO: ${{ matrix.distro }}
      TIER: ${{ matrix.tier }}
      VARIANT: ${{ matrix.variant }}
      OS_REFRESH: ${{ matrix.os_refresh }}
      PARENTS: ${{ toJSON(matrix.parents) }}
      TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # The created label needs this tool's last commit.
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.TRUSTED == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build unpublished parents
        if: ${{ toJSON(matrix.parents) != '[]' }}
        run: python3 .github/scripts/build.py parents

      - name: Prepare build options
        run: python3 .github/scripts/build.py prepare

      - name: Build
        run: python3 .github/scripts/build.py build

      - name: Structure test
        run: python3 .github/scripts/build.py structure

      - name: Smoke test
        timeout-minutes: 10
        run: python3 .github/scripts/build.py smoke

      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        with:
          version: v0.70.0
          cache: true

      - name: Secret scan
        run: python3 .github/scripts/build.py scan

      - name: Push by digest
        if: env.PUBLISH == 'true'
        run: python3 .github/scripts/build.py push

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.variant }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # One matrix entry per registry; each publishes every variant from the per-arch
  # digests pushed to GHCR by the build jobs. Add a registry by adding an entry.
  publish:
    name: Publish to ${{ matrix.name }}
    needs: [plan, build]
    # A failed variant must not prevent publication of other complete architecture pairs.
    # Run even without builds so Docker Hub can catch up with signed GHCR releases.
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub
    permissions:
      contents: read
      packages: write # Create tags, push signatures, delete untagged versions.
      id-token: write # Keyless cosign signing.
    strategy:
      fail-fast: false
      matrix:
        include:
          - registry: ghcr
            name: GHCR
            repo: ghcr.io/hambn
          - registry: dockerhub
            name: Docker Hub
            repo: docker.io/hambn
    env:
      TOOL: ${{ inputs.tool }}
      RECOVER: ${{ matrix.registry == 'dockerhub' }}
      IMAGE: ${{ needs.plan.outputs.image }}
      VERSION: ${{ needs.plan.outputs.version }}
      VARIANTS: ${{ needs.plan.outputs.variants }}
      LATEST_VARIANT: ${{ inputs.latest-variant }}
      VERSION_PREFIX: ${{ inputs.version-prefix }}
      REPO: ${{ matrix.repo }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.plan.outputs.variants != '[]'
        with:
          pattern: digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/digests
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver: docker # Manifest operations only.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: matrix.registry == 'dockerhub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create, tag, and sign the multi-arch images
        run: python3 .github/scripts/publish.py

      - name: Prune untagged versions older than 14 days
        if: ${{ !cancelled() && matrix.registry == 'ghcr' && needs.plan.outputs.variants != '[]' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ghcr_cleanup.py "$IMAGE"

      - name: Rewrite README links for Docker Hub
        id: readme
        if: ${{ !cancelled() && matrix.registry == 'dockerhub' && needs.plan.outputs.variants != '[]' }}
        env:
          TOOL: ${{ inputs.tool }}
        run: python3 .github/scripts/hub_readme.py "$TOOL/README.md" --output "$RUNNER_TEMP/README.md" --actions

      - if: ${{ !cancelled() && matrix.registry == 'dockerhub' && needs.plan.outputs.variants != '[]' }}
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE }}
          short-description: ${{ steps.readme.outputs.description }}
          readme-filepath: ${{ runner.temp }}/README.md

  dependents:
    name: Dispatch dependent images
    needs: [plan, publish]
    if: ${{ !cancelled() && inputs.dependents != '' && needs.plan.outputs.variants != '[]' && needs.publish.result != 'skipped' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write # Dispatch the dependent workflows.
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rebuild images whose parent moved
        env:
          GH_TOKEN: ${{ github.token }}
          DEPENDENTS: ${{ inputs.dependents }}
        run: python3 .github/scripts/dependents.py
