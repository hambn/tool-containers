name: validate/repository

on:
  pull_request:
    paths:
      - ".agents/**"
      - ".github/**"
      - ".gitignore"
      - "images/**"
      - "web-ui/**"
      - "**/*.md"
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
      - name: Install validation dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir pyyaml==6.0.2
      - name: Validate repository contracts
        run: .github/scripts/validate-repository.sh
