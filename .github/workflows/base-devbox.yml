name: base/devbox

on:
  pull_request:
    paths: &paths
      - "tools/base/devbox/**"
      - "tools/trivyignore.yaml"
      - ".github/workflows/base-devbox.yml"
      - ".github/workflows/tool-image.yml"
  push:
    branches: [main]
    paths: *paths
  # Daily check: rebuilds variants whose parent moved or whose published image has
  # fixable OS vulnerabilities.
  schedule:
    - cron: "15 6 * * *"
  # The parent's workflow dispatches this one with outdated-only after publishing.
  workflow_dispatch:
    inputs:
      outdated-only:
        description: Only rebuild variants whose parent moved or that have fixable OS vulnerabilities.
        type: boolean
        default: false

concurrency:
  group: base-devbox-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  image:
    name: devbox
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      actions: write
    uses: ./.github/workflows/tool-image.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      tool: tools/base/devbox
      primary: ubuntu-full
      outdated-only: ${{ inputs.outdated-only || false }}
      dependents: ai-agentbloat.yml ai-claude-code.yml ai-codex.yml ai-open-code-review.yml ai-pi-agent.yml
