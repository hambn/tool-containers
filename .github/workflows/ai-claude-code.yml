name: ai/claude-code

# Pushes and manual runs publish moving variant tags only. The hourly schedule checks
# the Claude Code package and all four agentimg base tags; a Claude release also adds
# one primary-image tag, for example claude-code-v1.2.3. A successful agentimg workflow run
# performs the same base-drift check immediately instead of waiting for the schedule.
on:
  push:
    branches: [main]
    paths:
      - "images/ai/claude-code/**"
      - ".github/workflows/ai-claude-code.yml"
      - ".github/scripts/**"
  schedule:
    - cron: "10 * * * *"
  workflow_run:
    workflows: ["base/agentimg"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

env:
  THING: ai/claude-code
  IMAGE: claude-code
  PRIMARY: ubuntu-browser
  PKG: "@anthropic-ai/claude-code"

jobs:
  plan:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, packages: read }
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
      build: ${{ steps.plan.outputs.build }}
      basedigests: ${{ steps.plan.outputs.basedigests }}
      claude_version: ${{ steps.plan.outputs.claude_version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source .github/scripts/registry-inspect.sh
          image="ghcr.io/${{ github.repository_owner }}/$IMAGE"
          variants=(alpine alpine-browser ubuntu ubuntu-browser)
          claude_version=$(npm view "$PKG" version)

          resolve_base() {
            sed -n 's/^ARG BASE_IMAGE=//p' "images/$THING/images/$1/Dockerfile" | head -n1
          }

          basedigests='{}'
          for variant in "${variants[@]}"; do
            ref=$(resolve_base "$variant")
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            basedigests=$(jq --arg variant "$variant" --arg digest "$digest" \
              '. + {($variant): $digest}' <<<"$basedigests")
          done

          selected=()
          release_tag=false
          case "$EVENT" in
            workflow_dispatch)
              selected=("${variants[@]}")
              ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                diff=$(git show --pretty='' --name-only "$SHA")
              else
                diff=$(git diff --name-only "$BEFORE" "$SHA")
              fi

              if grep -q '^\.github/workflows/ai-claude-code\.yml$' <<<"$diff" || \
                 grep -q '^images/ai/claude-code/\(README\.md\|deployment/\)' <<<"$diff"; then
                selected=("${variants[@]}")
              else
                for variant in "${variants[@]}"; do
                  grep -q "^images/$THING/images/$variant/" <<<"$diff" && \
                    selected+=("$variant") || true
                done
              fi
              ;;
            schedule|workflow_run)
              old_claude=$(registry_inspect "$image:latest" '{{ index .Image.Config.Labels "io.tool-containers.claude-code-version" }}')
              if [ "$claude_version" != "$old_claude" ]; then
                echo "claude-code: $old_claude -> $claude_version"
                selected=("${variants[@]}")
                release_tag=true
              else
                for variant in "${variants[@]}"; do
                  current=$(jq -r --arg variant "$variant" '.[$variant]' <<<"$basedigests")
                  old=$(registry_inspect "$image:$variant" '{{ index .Image.Config.Labels "io.tool-containers.agentimg-digest" }}')
                  if [ "$current" != "$old" ]; then
                    echo "$variant agentimg base: $old -> $current"
                    selected+=("$variant")
                  fi
                done
              fi
              ;;
            *)
              echo "unsupported event: $EVENT" >&2
              exit 1
              ;;
          esac

          variants_json=$(printf '%s\n' "${selected[@]}" | sed '/^$/d' | jq -R . | jq -cs 'unique')
          {
            echo "variants=$variants_json"
            echo "basedigests=$(jq -c . <<<"$basedigests")"
            echo "claude_version=$claude_version"
            echo "release_tag=$release_tag"
            if [ "$variants_json" = "[]" ]; then echo "build=false"; else echo "build=true"; fi
          } >>"$GITHUB_OUTPUT"
          echo "Will build: $variants_json"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # ponytail: amd64 only. Add arm64 through native runners after validating Node.js,
      # Claude Code, and all Alpine/Ubuntu agentimg variants on arm64.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/${{ env.THING }}/images/${{ matrix.variant }}
          platforms: linux/amd64
          provenance: true
          sbom: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/agentimg:${{ matrix.variant }}@${{ fromJSON(needs.plan.outputs.basedigests)[matrix.variant] }}
            CLAUDE_CODE_VERSION=${{ needs.plan.outputs.claude_version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.tool-containers.variant=${{ matrix.variant }}
            io.tool-containers.agentimg-digest=${{ fromJSON(needs.plan.outputs.basedigests)[matrix.variant] }}
            io.tool-containers.claude-code-version=${{ needs.plan.outputs.claude_version }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }},push-by-digest=true,push=true
          cache-from: type=gha,scope=${{ env.IMAGE }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}-${{ matrix.variant }}

      - name: Smoke-test inherited runtime and Claude Code
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint /bin/zsh "$IMAGE_REF" -lc '
            set -eux
            test "$(id -u)" = 1000
            test "$(id -un)" = sysadmin
            node --version
            npm --version
            test -s /usr/local/share/agentimg/node.version
            if test -f /etc/alpine-release; then apk info -e gcompat; fi
            claude --version
          '

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
        env:
          TRIVY_SKIP_FILES: "**/usr/local/bin/gh,**/usr/local/bin/glab,**/usr/local/bin/helm,**/usr/local/bin/kubectl,**/usr/local/bin/kustomize,**/usr/local/bin/yq,**/usr/local/bin/uv,**/usr/local/bin/uvx,**/usr/local/bin/node,**/usr/local/lib/node_modules/npm/node_modules/**,**/usr/bin/tailscale,**/usr/bin/tailscaled,**/usr/local/go/**,**/usr/local/lib/node_modules/@github/copilot/**"

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: secret
          exit-code: "1"

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" >"/tmp/digests/${{ matrix.variant }}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.variant }}
          path: /tmp/digests/${{ matrix.variant }}
          if-no-files-found: error

  push:
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        registry: [ghcr, dockerhub]
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Login GHCR
        if: matrix.registry == 'ghcr'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Login Docker Hub
        if: matrix.registry == 'dockerhub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Publish moving tags and Claude release tag
        env:
          VARIANTS: ${{ needs.plan.outputs.variants }}
          CLAUDE_VERSION: ${{ needs.plan.outputs.claude_version }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          source_image="ghcr.io/${{ github.repository_owner }}/$IMAGE"
          case "${{ matrix.registry }}" in
            ghcr) target="$source_image" ;;
            dockerhub) target="docker.io/$DOCKERHUB_USER/$IMAGE" ;;
          esac

          check_immutable() {
            local ref="$1" expected="$2" output status
            output=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>&1) && {
              [ "$output" = "$expected" ] || { echo "Immutable tag collision: $ref" >&2; return 1; }; return 0; }
            status=$?
            grep -Eiq 'manifest[[:space:]]+unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN|status code: 404|not found' <<<"$output" && return 0
            echo "Registry inspection failed for $ref: $output" >&2; return "$status"
          }

          for variant in $(jq -r '.[]' <<<"$VARIANTS"); do
            digest=$(cat "/tmp/digests/$variant")
            tags="$variant"
            [ "$variant" = "$PRIMARY" ] && tags="latest $tags"
            [ "$RELEASE_TAG" = true ] && [ "$variant" = "$PRIMARY" ] && \
              tags="$tags claude-code-v$CLAUDE_VERSION"
            [ "$RELEASE_TAG" = true ] && [ "$variant" = "$PRIMARY" ] && \
              check_immutable "$target:claude-code-v$CLAUDE_VERSION" "$digest"

            args=()
            for tag in $tags; do args+=(--tag "$target:$tag"); done
            echo "$variant -> $target ($tags)"
            docker buildx imagetools create "${args[@]}" "$source_image@$digest"
          done
