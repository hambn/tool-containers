name: pull-request/policy

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate title and description
        env:
          ACTOR: ${{ github.actor }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re

          actor = os.environ["ACTOR"]
          body = os.environ.get("PR_BODY", "")
          title = os.environ["PR_TITLE"]

          title_pattern = re.compile(
              r"^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)"
              r"(\([a-z0-9][a-z0-9._/-]*\))?!?: .+"
          )
          if not title_pattern.fullmatch(title):
              raise SystemExit(
                  "PR title must follow Conventional Commits, for example "
                  "'fix(agentimg): preserve runtime ownership'."
              )

          if actor != "dependabot[bot]":
              required = ("Summary", "Validation")
              headings = list(re.finditer(r"^##[ \t]+(.+?)[ \t]*$", body, re.MULTILINE))
              sections = {}
              for index, match in enumerate(headings):
                  name = match.group(1)
                  if name not in required:
                      continue
                  end = headings[index + 1].start() if index + 1 < len(headings) else len(body)
                  sections[name] = body[match.end():end]

              missing = [f"## {name}" for name in required if name not in sections]
              if missing:
                  raise SystemExit(f"PR body is missing required sections: {', '.join(missing)}")

              empty = []
              for name in required:
                  content = re.sub(r"<!--.*?-->", "", sections[name], flags=re.DOTALL)
                  meaningful = [
                      line.strip()
                      for line in content.splitlines()
                      if line.strip()
                      and not line.lstrip().startswith(("#", "- ["))
                      and line.strip() != "-"
                  ]
                  if not meaningful:
                      empty.append(f"## {name}")
              if empty:
                  raise SystemExit(
                      f"PR body sections must contain meaningful details: {', '.join(empty)}"
                  )
          PY
