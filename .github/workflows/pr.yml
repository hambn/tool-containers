name: pull-request/gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: pull-request-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gate:
    name: Pull request gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: src/ci/go.mod
          cache-dependency-path: src/ci/go.sum
      - name: Build CI CLI
        run: cd src/ci && go build -o "$RUNNER_TEMP/ci" ./cmd/ci

      - name: Validate pull request title and description
        if: github.event_name == 'pull_request'
        env:
          ACTOR: ${{ github.actor }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: '"$RUNNER_TEMP/ci" pr'

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Test Go CI
        run: cd src/ci && go test ./...
      - name: Validate repository contracts
        run: '"$RUNNER_TEMP/ci" validate'

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@4b73464bb391d4059bd26b0524d20df3927bd417 # v6.3.0
        with:
          go-version-file: src/ci/go.mod
          cache-dependency-path: src/ci/go.sum
      - name: Build CI CLI
        run: cd src/ci && go build -o "$RUNNER_TEMP/ci" ./cmd/ci

      - name: Go vet
        run: cd src/ci && go vet ./...
      - name: Install linters
        run: '"$RUNNER_TEMP/ci" install linters'
      - name: Lint repository
        run: '"$RUNNER_TEMP/ci" lint'
      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: 1.30.1
