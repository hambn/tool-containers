name: pull-request/gate

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: pull-request-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  gate:
    name: Pull request gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate pull request title and description
        if: github.event_name == 'pull_request'
        env:
          ACTOR: ${{ github.actor }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 .github/scripts/validate_pr_metadata.py

      - name: Review dependency changes
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

      - name: Install validation dependency
        run: python3 -m pip install --disable-pip-version-check --no-cache-dir -r .github/requirements.txt

      - name: Validate repository contracts
        run: python3 .github/scripts/check-repo.py

  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install linters
        run: |
          set -euo pipefail
          mkdir -p /tmp/lint/bin
          cd /tmp/lint
          fetch() {
              curl -fsSLo "$1" "$2"
              echo "$3  $1" | sha256sum -c -
          }
          fetch actionlint.tar.gz https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz \
              8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          tar -xzf actionlint.tar.gz -C bin actionlint
          fetch bin/hadolint https://github.com/hadolint/hadolint/releases/download/v2.15.1/hadolint-linux-x86_64 \
              c7187db94eeeeca956519a6af171adc31453941a1e777961f6e680f697c8c507
          fetch shellcheck.tar.gz https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.gz \
              b7af85e41cc99489dcc21d66c6d5f3685138f06d34651e6d34b42ec6d54fe6f6
          tar -xzf shellcheck.tar.gz --strip-components=1 -C bin shellcheck-v0.11.0/shellcheck
          fetch bin/shfmt https://github.com/mvdan/sh/releases/download/v3.14.1/shfmt_v3.14.1_linux_amd64 \
              76e77641faa025814b77f153b29796b8e6fa2fca03e0c76a691608b86c7ea7bf
          chmod +x bin/*
          echo /tmp/lint/bin >>"$GITHUB_PATH"

      - name: actionlint
        run: actionlint -color

      # Ignored by design: the base image arrives as the BASE_IMAGE build arg (DL3006),
      # devbox overlays its config stage as a whole filesystem (DL3067), build stages
      # end as root and the final stage switches to the named user (DL3002, DL3066),
      # and OS packages float with OS_REFRESH instead of version pins (DL3008, DL3018).
      - name: hadolint
        run: >-
          git ls-files -z 'tools/**/Dockerfile' | xargs -0 -r hadolint
          --ignore DL3002 --ignore DL3006 --ignore DL3008 --ignore DL3018 --ignore DL3066 --ignore DL3067

      - name: shellcheck
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck

      - name: shfmt
        run: git ls-files -z '*.sh' | xargs -0 -r shfmt -d -i 4

      - name: zizmor
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          version: 1.30.1
