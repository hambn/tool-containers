name: ai/open-code-review

on:
  pull_request:
    paths: &paths
      - "tools/ai/open-code-review/**"
      - "tools/trivyignore.yaml"
      - ".github/workflows/ai-open-code-review.yml"
      - ".github/workflows/tool-image.yml"
  push:
    branches: [main]
    paths: *paths
  # Daily check: rebuilds variants whose parent moved or whose published image has
  # fixable OS vulnerabilities.
  schedule:
    - cron: "40 6 * * *"
  # The parent's workflow dispatches this one with outdated-only after publishing.
  workflow_dispatch:
    inputs:
      outdated-only:
        description: Only rebuild variants whose parent moved or that have fixable OS vulnerabilities.
        type: boolean
        default: false

concurrency:
  group: ai-open-code-review-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  image:
    name: open-code-review
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      actions: write
    uses: ./.github/workflows/tool-image.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      tool: tools/ai/open-code-review
      primary: ubuntu-browser
      version-arg: OPEN_CODE_REVIEW_VERSION
      outdated-only: ${{ inputs.outdated-only || false }}
