name: base/agentimg

# Push: build only variants whose Dockerfile or shared image asset changed. Publish
#        stable tags plus <variant>-<commit-short-sha>.
# Schedule: rebuild every variant with current upstream tools. Repoint stable tags only.
# Dispatch: build every variant and repoint stable tags only.
on:
  push:
    branches: [main]
    paths:
      - "images/base/agentimg/images/**"
      - ".github/workflows/base-agentimg.yml"
      - ".github/scripts/registry-inspect.sh"
  schedule:
    - cron: "0 4 * * 0"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  THING: base/agentimg
  IMAGE: agentimg
  OWNER: ${{ github.repository_owner }}
  PRIMARY: ubuntu-browser

jobs:
  plan:
    name: Plan publish candidates
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # Needed to inspect current GHCR image metadata.
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
      build: ${{ steps.plan.outputs.build }}
      basefingerprints: ${{ steps.plan.outputs.basefingerprints }}
      baseimages: ${{ steps.plan.outputs.baseimages }}
      commit_tag: ${{ steps.plan.outputs.commit_tag }}
      short_sha: ${{ steps.plan.outputs.short_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source .github/scripts/registry-inspect.sh

          resolve_arg_ref() {
            local dockerfile="$1" ref="$2" var default
            while grep -q '\${' <<<"$ref"; do
              var=$(sed -E 's/.*\$\{([A-Za-z_][A-Za-z0-9_]*)\}.*/\1/' <<<"$ref")
              default=$(grep -m1 -E "^ARG ${var}=" "$dockerfile" | cut -d= -f2-)
              ref=${ref//\$\{${var}\}/$default}
            done
            printf '%s\n' "$ref"
          }

          mapfile -t all < <(
            find "images/$THING/images" -mindepth 1 -maxdepth 1 -type f \
              -name '*.Dockerfile' -printf '%f\n' |
              sed 's/\.Dockerfile$//' |
              sort
          )
          test "${#all[@]}" -gt 0

          fingerprints='{}'
          baseimages='{}'
          for variant in "${all[@]}"; do
            dockerfile="images/$THING/images/$variant.Dockerfile"
            mapfile -t refs < <(awk 'toupper($1) == "FROM" { print $2 }' "$dockerfile")
            [ "${#refs[@]}" -gt 0 ] || { echo "No FROM in $dockerfile" >&2; exit 1; }
            digested_refs=()
            for ref in "${refs[@]}"; do
              ref=$(resolve_arg_ref "$dockerfile" "$ref")
              digest=$(registry_inspect "$ref" '{{.Manifest.Digest}}')
              if [ "$digest" = "missing" ]; then
                echo "Missing base image: $ref" >&2
                exit 1
              fi
              digested_refs+=("$ref@$digest")
            done
            browser_ref=${digested_refs[0]}
            runtime_ref=${digested_refs[${#digested_refs[@]}-1]}
            baseimages=$(jq --arg variant "$variant" \
              --arg runtime "$runtime_ref" \
              --arg browser "$browser_ref" \
              '. + {($variant): {runtime: $runtime, browser: $browser}}' <<<"$baseimages")
            fingerprint=$(printf '%s\n' "${digested_refs[@]}" | sha256sum | cut -d' ' -f1)
            fingerprints=$(jq \
              --arg variant "$variant" \
              --arg fingerprint "$fingerprint" \
              '. + {($variant): $fingerprint}' <<<"$fingerprints")
          done

          selected=()
          commit_tag=false
          case "$EVENT" in
            push)
              commit_tag=true
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                diff=$(git show --pretty='' --name-only "$SHA")
              else
                diff=$(git diff --name-only "$BEFORE" "$SHA")
              fi
              if grep -q '^\.github/workflows/base-agentimg\.yml$' <<<"$diff" ||
                 grep -q '^\.github/scripts/registry-inspect\.sh$' <<<"$diff"; then
                selected=("${all[@]}")
              else
                selected=()
                while read -r changed; do
                  relative=${changed#images/$THING/images/}
                  if [[ "$relative" == *.Dockerfile ]]; then
                    variant=${relative%.Dockerfile}
                    for candidate in "${all[@]}"; do
                      [ "$candidate" = "$variant" ] && selected+=("$candidate")
                    done
                  elif [[ "$relative" == */* ]]; then
                    family=${relative%%/*}
                    if [ "$family" = common ]; then
                      selected=("${all[@]}")
                      break
                    fi
                    for candidate in "${all[@]}"; do
                      [[ "$candidate" = "$family" || "$candidate" == "$family-"* ]] &&
                        selected+=("$candidate")
                    done
                  fi
                done <<<"$diff"
              fi
              ;;
            schedule)
              selected=("${all[@]}")
              ;;
            workflow_dispatch)
              selected=("${all[@]}")
              ;;
          esac

          variants=$(printf '%s\n' "${selected[@]}" | sed '/^$/d' | jq -R . | jq -cs 'unique')
          short_sha=$(cut -c1-12 <<<"$SHA")
          {
            echo "variants=$variants"
            echo "basefingerprints=$(jq -c . <<<"$fingerprints")"
            echo "baseimages=$(jq -c . <<<"$baseimages")"
            echo "commit_tag=$commit_tag"
            echo "short_sha=$short_sha"
            if [ "$variants" = "[]" ]; then echo "build=false"; else echo "build=true"; fi
          } >>"$GITHUB_OUTPUT"
          echo "Will build: $variants"

  build:
    name: Build and scan ${{ matrix.variant }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # Needed to push the untagged digest for validation.
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      # ponytail: amd64 only. Add arm64 through a native runner and manifest merge after
      # validating every Ubuntu and Alpine package plus the headless browser on arm64.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/${{ env.THING }}/images
          file: images/${{ env.THING }}/images/${{ matrix.variant }}.Dockerfile
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          pull: true
          no-cache: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
          build-args: |
            RUNTIME_BASE=${{ fromJSON(needs.plan.outputs.baseimages)[matrix.variant].runtime }}
            BROWSER_BASE=${{ fromJSON(needs.plan.outputs.baseimages)[matrix.variant].browser }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.tool-containers.variant=${{ matrix.variant }}
            io.tool-containers.base-fingerprint=${{ fromJSON(needs.plan.outputs.basefingerprints)[matrix.variant] }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }},push-by-digest=true,push=true
          cache-from: type=gha,scope=${{ env.IMAGE }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}-${{ matrix.variant }}

      - name: Smoke-test the non-root shell and installed tools
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          docker run --rm --entrypoint /bin/zsh "$IMAGE_REF" -lic '
            set -eux
            test "$(id -u)" = 1000
            test "$(id -un)" = sysadmin
            test "$HOME" = /home/sysadmin
            test "$ZDOTDIR" = /home/sysadmin
            test "$PWD" = /home/sysadmin
            test "$SHELL" = /bin/zsh
            test "$EDITOR" = nvim
            test "$LANG" = C.UTF-8
            [[ ":$PATH:" = *":$HOME/.local/bin:"* ]]
            test -w "$HOME"
            test -r "$ZDOTDIR/.zshenv"
            test -r "$ZDOTDIR/.zshrc"
            test -r "$ZDOTDIR/.zprofile"
            test -d "$HOME/.kube"
            test "$(stat -c %a "$HOME/.kube")" = 700
            test -w "$XDG_RUNTIME_DIR"
            test -r /usr/local/share/zsh/site-functions/_kubectl
            alias k >/dev/null
            required_commands=(
              aria2c autoconf automake bash bison brotli bwrap bzip2 cmake curl dialog dig
              docker envsubst fakeroot fd ffmpeg flex fzf gh git git-lfs glab go gpg helm hg
              htop http infocmp iperf3 jq kubectl kustomize make man mitmproxy mtr nano
              nginx ninja nmap node nodejs npm npx nvim parallel patch pipx pkg-config pnpm ps
              python3 rg rsync shellcheck shfmt ssh strace sudo tailscale tcpdump tmux traceroute
              uv whois xz yamllint yarn yq zip zsh zstd
            )
            for tool in $required_commands; do
              command -v "$tool" >/dev/null || {
                echo "missing required command: $tool" >&2
                exit 1
              }
            done
            test "$(sudo -n id -u)" = 0
            getcap "$(readlink -f "$(command -v ping)")" | grep -q cap_net_raw
            ping -c 1 127.0.0.1
            gh --version
            glab --version
            go version
            node --version
            npm --version
            npx --version
            pnpm --version
            yarn --version
            helm version --short
            kustomize version
            yq --version
            git lfs version
            test -s /usr/local/share/agentimg/go.version
            cat /usr/local/share/agentimg/go.version
            for version_file in helm kustomize node yq; do
              test -s "/usr/local/share/agentimg/$version_file.version"
              cat "/usr/local/share/agentimg/$version_file.version"
            done
            kubectl version --client=true --output=yaml
            infocmp xterm-ghostty >/dev/null
            test "$(git config --system --get init.defaultBranch)" = main
            test -s /usr/local/share/agentimg/zsh-autosuggestions.version
            cat /usr/local/share/agentimg/zsh-autosuggestions.version
            docker --version
            docker buildx version
            docker compose version
            if command -v systemctl >/dev/null; then
              test "$(systemctl --root=/ get-default)" = multi-user.target
              test -e /var/lib/systemd/linger/sysadmin
              grep -qx "Storage=volatile" /etc/systemd/journald.conf.d/agentimg-container.conf
              grep -qx "d /tmp 1777 root root 30d" /etc/tmpfiles.d/tmp.conf
              test "$(readlink /etc/systemd/system/systemd-resolved.service)" = /dev/null
            fi
            if [[ -n "${BROWSER_BIN:-}" ]]; then test -x "$BROWSER_BIN"; fi
            smoke_file="$HOME/.agentimg-smoke-$$"
            touch "$smoke_file"
            rm -f "$smoke_file"
          '
          docker run --rm --entrypoint /bin/zsh "$IMAGE_REF" -lc '
            set -eu
            [[ ":$PATH:" = *":$HOME/.local/bin:"* ]]
            command -v node npm pnpm kubectl helm yq
          '

      - name: Smoke-test Docker through an external daemon socket
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          socket_gid=$(stat -c %g /var/run/docker.sock)
          docker run --rm --group-add "$socket_gid" \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --entrypoint /bin/zsh "$IMAGE_REF" -lic '
              set -e
              docker version
              docker info --format "{{.ServerVersion}}"
              docker buildx ls
            '

      - name: Boot-test the opt-in systemd profile
        if: startsWith(matrix.variant, 'ubuntu')
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          container_id=$(docker run --detach --privileged --cgroupns=private \
            --user root --tmpfs /run --tmpfs /run/lock \
            --entrypoint /sbin/init "$IMAGE_REF")
          cleanup() {
            docker rm --force "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          state=starting
          for _ in {1..45}; do
            set +e
            state=$(docker exec "$container_id" systemctl is-system-running 2>/dev/null)
            set -e
            case "$state" in
              running|degraded) break ;;
            esac
            sleep 1
          done

          if [ "$state" != running ]; then
            docker exec "$container_id" systemctl --failed --no-legend --plain || true
            docker logs "$container_id" || true
            exit 1
          fi
          test -z "$(docker exec "$container_id" \
            systemctl --failed --no-legend --plain)"
          docker exec "$container_id" systemctl is-active --quiet systemd-journald.service
          docker exec "$container_id" test -e /run/user/1000

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
        env:
          TRIVY_SKIP_FILES: "**/usr/local/bin/gh,**/usr/local/bin/glab,**/usr/local/bin/helm,**/usr/local/bin/kubectl,**/usr/local/bin/kustomize,**/usr/local/bin/yq,**/usr/local/bin/uv,**/usr/local/bin/uvx,**/usr/local/bin/node,**/usr/local/lib/node_modules/npm/node_modules/**,**/usr/bin/tailscale,**/usr/bin/tailscaled,**/usr/local/go/**,**/usr/local/lib/node_modules/@github/copilot/**"

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: secret
          exit-code: "1"

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VARIANT" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          mkdir -p /tmp/digests
          printf '%s\n' "$DIGEST" >"/tmp/digests/$VARIANT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.variant }}
          path: /tmp/digests/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 1

  push:
    name: Publish to ${{ matrix.registry }}
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ matrix.registry }}
    permissions:
      packages: write # Needed to promote the validated digest to GHCR tags.
    strategy:
      fail-fast: false
      matrix:
        registry: [ghcr, dockerhub]
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Login GHCR
        if: matrix.registry == 'ghcr'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Login Docker Hub
        if: matrix.registry == 'dockerhub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Publish selected tags to ${{ matrix.registry }}
        env:
          VARIANTS: ${{ needs.plan.outputs.variants }}
          COMMIT_TAG: ${{ needs.plan.outputs.commit_tag }}
          SHORT_SHA: ${{ needs.plan.outputs.short_sha }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY: ${{ matrix.registry }}
        run: |
          set -euo pipefail
          source_image="ghcr.io/$OWNER/$IMAGE"
          case "$REGISTRY" in
            ghcr) target="$source_image" ;;
            dockerhub) target="docker.io/$DOCKERHUB_USER/$IMAGE" ;;
          esac

          check_immutable() {
            local ref="$1" expected="$2" output status
            output=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>&1) && {
              [ "$output" = "$expected" ] || { echo "Immutable tag collision: $ref" >&2; return 1; }; return 0; }
            status=$?; grep -Eiq 'manifest[[:space:]]+unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN|status code: 404|not found' <<<"$output" && return 0
            echo "Registry inspection failed for $ref: $output" >&2; return "$status"
          }

          for variant in $(jq -r '.[]' <<<"$VARIANTS"); do
            digest=$(cat "/tmp/digests/$variant")
            tags="$variant"
            [ "$variant" = "$PRIMARY" ] && tags="latest $tags"
            [ "$COMMIT_TAG" = true ] && tags="$tags $variant-$SHORT_SHA"
            [ "$COMMIT_TAG" = true ] && \
              check_immutable "$target:$variant-$SHORT_SHA" "$digest"

            args=()
            for tag in $tags; do args+=(--tag "$target:$tag"); done
            echo "$variant -> $target ($tags)"
            docker buildx imagetools create "${args[@]}" "$source_image@$digest"
          done
