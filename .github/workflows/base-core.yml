name: base/core

on:
  pull_request:
    paths: &paths
      - "tools/base/core/**"
      - "tools/trivyignore.yaml"
      - ".github/workflows/base-core.yml"
      - ".github/workflows/tool-image.yml"
  push:
    branches: [main]
    paths: *paths
  # Daily check: rebuilds variants whose published image has fixable OS vulnerabilities.
  schedule:
    - cron: "5 6 * * *"
  workflow_dispatch:

concurrency:
  group: base-core-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  image:
    name: core
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      attestations: write
    uses: ./.github/workflows/tool-image.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      tool: tools/base/core
      primary: wolfi
