name: ai/agentbloat

on:
  pull_request:
    paths: &paths
      - "tools/ai/agentbloat/**"
      - "tools/trivyignore.yaml"
      - ".github/workflows/ai-agentbloat.yml"
      - ".github/workflows/tool-image.yml"
  push:
    branches: [main]
    paths: *paths
  # Daily check: rebuilds variants whose parent moved or whose published image has
  # fixable OS vulnerabilities.
  schedule:
    - cron: "25 6 * * *"
  # The parent's workflow dispatches this one with outdated-only after publishing.
  workflow_dispatch:
    inputs:
      outdated-only:
        description: Only rebuild variants whose parent moved or that have fixable OS vulnerabilities.
        type: boolean
        default: false

concurrency:
  group: ai-agentbloat-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  image:
    name: agentbloat
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      actions: write
    uses: ./.github/workflows/tool-image.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      tool: tools/ai/agentbloat
      tags: |
        # Stable variant tags; latest is the lightest Ubuntu variant.
        echo "$VARIANT"
        if [ "$VARIANT" = ubuntu ]; then
            echo latest
        fi
      outdated-only: ${{ inputs.outdated-only || false }}
      dependents: ai-omnigent.yml ai-t3code.yml
