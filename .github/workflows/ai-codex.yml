name: ai/codex

on:
  pull_request:
    paths: &paths
      - "tools/ai/codex/**"
      - "tools/trivyignore.yaml"
      - ".github/workflows/ai-codex.yml"
      - ".github/workflows/tool-image.yml"
      - ".github/scripts/build.py"
      - ".github/scripts/ci.py"
      - ".github/scripts/dependents.py"
      - ".github/scripts/ghcr_cleanup.py"
      - ".github/scripts/hub_readme.py"
      - ".github/scripts/image_common.py"
      - ".github/scripts/plan.py"
      - ".github/scripts/publish.py"
  push:
    branches: [main]
    paths: *paths
  # Daily check: rebuilds variants whose parent moved or whose published image has
  # fixable OS vulnerabilities.
  schedule:
    - cron: "35 6 * * *"
  # The parent's workflow dispatches this one with outdated-only after publishing.
  workflow_dispatch:
    inputs:
      outdated-only:
        description: Only rebuild variants whose parent moved or that have fixable OS vulnerabilities.
        type: boolean
        default: false

concurrency:
  group: ai-codex-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  image:
    name: codex
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      actions: write
    uses: ./.github/workflows/tool-image.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      tool: tools/ai/codex
      latest-variant: ubuntu
      version-prefix: codex
      version-arg: CODEX_VERSION
      outdated-only: ${{ inputs.outdated-only || false }}
