name: ai/codex

# Moving tags are refreshed for source edits, Codex releases, and agentimg base
# refreshes. Only a detected Codex release also creates codex-v<version> on primary.
on:
  push:
    branches: [main]
    paths:
      - "ai/codex/**"
      - ".github/workflows/ai-codex.yml"
      - ".github/scripts/**"
  schedule:
    - cron: "20 * * * *"
  workflow_run:
    workflows: ["base/agentimg"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

env:
  THING: ai/codex
  IMAGE: codex
  PRIMARY: ubuntu-browser
  PKG: "@openai/codex"

jobs:
  plan:
    if: (github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success') && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions: { contents: read, packages: read }
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
      build: ${{ steps.plan.outputs.build }}
      basedigests: ${{ steps.plan.outputs.basedigests }}
      codex_version: ${{ steps.plan.outputs.codex_version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source .github/scripts/registry-inspect.sh
          image="ghcr.io/${{ github.repository_owner }}/$IMAGE"
          variants=(alpine alpine-browser ubuntu ubuntu-browser)
          codex_version=$(npm view "$PKG" version)

          resolve_base() {
            sed -n 's/^ARG BASE_IMAGE=//p' "$THING/images/$1/Dockerfile" | head -n1
          }

          basedigests='{}'
          for variant in "${variants[@]}"; do
            ref=$(resolve_base "$variant")
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            basedigests=$(jq --arg variant "$variant" --arg digest "$digest" \
              '. + {($variant): $digest}' <<<"$basedigests")
          done

          tag_of() {
            [ "$1" = "$PRIMARY" ] && echo latest || echo "$1"
          }

          selected=()
          release_tag=""
          case "$EVENT" in
            workflow_dispatch)
              selected=("${variants[@]}")
              ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                selected=("${variants[@]}")
              else
                if ! diff=$(git diff --name-only "$BEFORE" "$SHA"); then
                  echo "Unable to compute push diff; refusing to publish" >&2
                  exit 1
                fi
                if grep -q '^\.github/workflows/ai-codex\.yml$' <<<"$diff" || \
                   grep -q '^ai/codex/\(README\.md\|deployment/\)' <<<"$diff"; then
                  selected=("${variants[@]}")
                else
                  for variant in "${variants[@]}"; do
                    grep -q "^$THING/images/$variant/" <<<"$diff" && \
                      selected+=("$variant") || true
                  done
                fi
              fi
              ;;
            schedule|workflow_run)
              old_codex=$(registry_inspect "$image:latest" '{{ index .Image.Config.Labels "io.tool-containers.codex-version" }}')
              if [ "$old_codex" != "$codex_version" ]; then
                echo "codex: $old_codex -> $codex_version"
                selected=("${variants[@]}")
                release_tag="codex-v$codex_version"
              else
                for variant in "${variants[@]}"; do
                  current=$(jq -r --arg variant "$variant" '.[$variant]' <<<"$basedigests")
                  previous="${image}:$(tag_of "$variant")"
                  old=$(registry_inspect "$previous" '{{ index .Image.Config.Labels "io.tool-containers.agentimg-digest" }}')
                  if [ "$current" != "$old" ]; then
                    echo "$variant agentimg base: $old -> $current"
                    selected+=("$variant")
                  fi
                done
              fi
              ;;
            *)
              echo "unsupported event: $EVENT" >&2
              exit 1
              ;;
          esac

          variants_json=$(printf '%s\n' "${selected[@]}" | sed '/^$/d' | jq -R . | jq -cs 'unique')
          {
            echo "variants=$variants_json"
            echo "basedigests=$(jq -c . <<<"$basedigests")"
            echo "codex_version=$codex_version"
            echo "release_tag=$release_tag"
            if [ "$variants_json" = "[]" ]; then echo "build=false"; else echo "build=true"; fi
          } >>"$GITHUB_OUTPUT"
          echo "Will build: $variants_json"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions: { contents: read, packages: write, id-token: write, attestations: write }
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      # ponytail: amd64 only. Add arm64 through a native runner after validating
      # the Codex npm package and the browser-enabled agentimg variants.
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ${{ env.THING }}/images/${{ matrix.variant }}
          platforms: linux/amd64
          provenance: true
          sbom: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/agentimg:${{ matrix.variant }}@${{ fromJSON(needs.plan.outputs.basedigests)[matrix.variant] }}
            CODEX_VERSION=${{ needs.plan.outputs.codex_version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.tool-containers.variant=${{ matrix.variant }}
            io.tool-containers.agentimg-digest=${{ fromJSON(needs.plan.outputs.basedigests)[matrix.variant] }}
            io.tool-containers.codex-version=${{ needs.plan.outputs.codex_version }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }},push-by-digest=true,push=true
          cache-from: type=gha,scope=${{ env.IMAGE }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}-${{ matrix.variant }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" >"/tmp/digests/${{ matrix.variant }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.variant }}
          path: /tmp/digests/${{ matrix.variant }}
          if-no-files-found: error

  push:
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        registry: [ghcr, dockerhub]
    steps:
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Login GHCR
        if: matrix.registry == 'ghcr'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Login Docker Hub
        if: matrix.registry == 'dockerhub'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Publish moving and release tags
        env:
          VARIANTS: ${{ needs.plan.outputs.variants }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          source_image="ghcr.io/${{ github.repository_owner }}/$IMAGE"
          case "${{ matrix.registry }}" in
            ghcr) target="$source_image" ;;
            dockerhub) target="docker.io/$DOCKERHUB_USER/$IMAGE" ;;
          esac

          check_immutable() {
            local ref="$1" expected="$2" output status
            output=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>&1) && {
              [ "$output" = "$expected" ] || { echo "Immutable tag collision: $ref" >&2; return 1; }; return 0; }
            status=$?; grep -Eiq 'manifest[[:space:]]+unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN|status code: 404|404 Not Found|does not exist' <<<"$output" && return 0
            echo "Registry inspection failed for $ref: $output" >&2; return "$status"
          }

          for variant in $(jq -r '.[]' <<<"$VARIANTS"); do
            digest=$(cat "/tmp/digests/$variant")
            tags="$variant"
            [ "$variant" = "$PRIMARY" ] && tags="latest $tags"
            [ "$variant" = "$PRIMARY" ] && [ -n "$RELEASE_TAG" ] && \
              tags="$tags $RELEASE_TAG"
            [ "$variant" = "$PRIMARY" ] && [ -n "$RELEASE_TAG" ] && \
              check_immutable "$target:$RELEASE_TAG" "$digest"

            args=()
            for tag in $tags; do args+=(--tag "$target:$tag"); done
            echo "$variant -> $target ($tags)"
            docker buildx imagetools create "${args[@]}" "$source_image@$digest"
          done
