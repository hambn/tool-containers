name: ai/codex

# Moving tags are refreshed for source edits, Codex releases, and agentimg base
# refreshes. Only a detected Codex release also creates codex-v<version> on primary.
on:
  push:
    branches: [main]
    paths:
      - "images/ai/codex/**"
      - ".github/workflows/ai-codex.yml"
  schedule:
    - cron: "0 * * * *"
  workflow_run:
    workflows: ["base/agentimg"]
    types: [completed]
  workflow_dispatch:

env:
  THING: ai/codex
  IMAGE: codex
  PRIMARY: ubuntu-browser
  PKG: "@openai/codex"

jobs:
  plan:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: read }
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
      build: ${{ steps.plan.outputs.build }}
      basedigests: ${{ steps.plan.outputs.basedigests }}
      codex_version: ${{ steps.plan.outputs.codex_version }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          image="ghcr.io/${{ github.repository_owner }}/$IMAGE"
          variants=(alpine alpine-browser ubuntu ubuntu-browser)
          codex_version=$(npm view "$PKG" version)

          resolve_base() {
            awk 'toupper($1) == "FROM" { ref=$2 } END { print ref }' \
              "images/$THING/images/$1/Dockerfile"
          }

          basedigests='{}'
          for variant in "${variants[@]}"; do
            ref=$(resolve_base "$variant")
            digest=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}')
            basedigests=$(jq --arg variant "$variant" --arg digest "$digest" \
              '. + {($variant): $digest}' <<<"$basedigests")
          done

          tag_of() {
            [ "$1" = "$PRIMARY" ] && echo latest || echo "$1"
          }

          selected=()
          release_tag=""
          case "$EVENT" in
            workflow_dispatch)
              selected=("${variants[@]}")
              ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                selected=("${variants[@]}")
              else
                diff=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || true)
                if grep -q '^\.github/workflows/ai-codex\.yml$' <<<"$diff" || \
                   grep -q '^images/ai/codex/\(README\.md\|deployment/\)' <<<"$diff"; then
                  selected=("${variants[@]}")
                else
                  for variant in "${variants[@]}"; do
                    grep -q "^images/$THING/images/$variant/" <<<"$diff" && \
                      selected+=("$variant") || true
                  done
                fi
              fi
              ;;
            schedule|workflow_run)
              old_codex=$(docker buildx imagetools inspect "$image:latest" \
                --format '{{ index .Image.Config.Labels "io.tool-containers.codex-version" }}' \
                2>/dev/null || echo missing)
              if [ "$old_codex" != "$codex_version" ]; then
                echo "codex: $old_codex -> $codex_version"
                selected=("${variants[@]}")
                release_tag="codex-v$codex_version"
              else
                for variant in "${variants[@]}"; do
                  current=$(jq -r --arg variant "$variant" '.[$variant]' <<<"$basedigests")
                  previous="${image}:$(tag_of "$variant")"
                  old=$(docker buildx imagetools inspect "$previous" \
                    --format '{{ index .Image.Config.Labels "io.tool-containers.agentimg-digest" }}' \
                    2>/dev/null || echo missing)
                  if [ "$current" != "$old" ]; then
                    echo "$variant agentimg base: $old -> $current"
                    selected+=("$variant")
                  fi
                done
              fi
              ;;
            *)
              echo "unsupported event: $EVENT" >&2
              exit 1
              ;;
          esac

          variants_json=$(printf '%s\n' "${selected[@]}" | sed '/^$/d' | jq -R . | jq -cs 'unique')
          {
            echo "variants=$variants_json"
            echo "basedigests=$(jq -c . <<<"$basedigests")"
            echo "codex_version=$codex_version"
            echo "release_tag=$release_tag"
            if [ "$variants_json" = "[]" ]; then echo "build=false"; else echo "build=true"; fi
          } >>"$GITHUB_OUTPUT"
          echo "Will build: $variants_json"

  build:
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # ponytail: amd64 only. Add arm64 through a native runner after validating
      # the Codex npm package and the browser-enabled agentimg variants.
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: images/${{ env.THING }}/images/${{ matrix.variant }}
          platforms: linux/amd64
          provenance: false
          build-args: CODEX_VERSION=${{ needs.plan.outputs.codex_version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.tool-containers.variant=${{ matrix.variant }}
            io.tool-containers.agentimg-digest=${{ fromJSON(needs.plan.outputs.basedigests)[matrix.variant] }}
            io.tool-containers.codex-version=${{ needs.plan.outputs.codex_version }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }},push-by-digest=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}

      - name: Smoke-test inherited runtime and Codex
        env:
          IMAGE_REF: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
        run: |
          docker run --rm --entrypoint /bin/zsh "$IMAGE_REF" -lc '
            set -eux
            test "$(id -u)" = 1000
            test "$(id -un)" = sysadmin
            node --version
            npm --version
            test -s /usr/local/share/agentimg/node.version
            if test -f /etc/alpine-release; then apk info -e gcompat; fi
            codex --version
          '

      - name: Trivy scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "0"

      - name: Save digest
        run: |
          mkdir -p /tmp/digests
          echo "${{ steps.build.outputs.digest }}" >"/tmp/digests/${{ matrix.variant }}"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.variant }}
          path: /tmp/digests/${{ matrix.variant }}
          if-no-files-found: error

  push:
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    strategy:
      fail-fast: false
      matrix:
        registry: [ghcr, dockerhub]
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Login GHCR
        if: matrix.registry == 'ghcr'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Login Docker Hub
        if: matrix.registry == 'dockerhub'
        uses: docker/login-action@v3
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Publish moving and release tags
        env:
          VARIANTS: ${{ needs.plan.outputs.variants }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          source_image="ghcr.io/${{ github.repository_owner }}/$IMAGE"
          case "${{ matrix.registry }}" in
            ghcr) target="$source_image" ;;
            dockerhub) target="docker.io/$DOCKERHUB_USER/$IMAGE" ;;
          esac

          for variant in $(jq -r '.[]' <<<"$VARIANTS"); do
            digest=$(cat "/tmp/digests/$variant")
            tags="$variant"
            [ "$variant" = "$PRIMARY" ] && tags="latest $tags"
            [ "$variant" = "$PRIMARY" ] && [ -n "$RELEASE_TAG" ] && \
              tags="$tags $RELEASE_TAG"

            args=()
            for tag in $tags; do args+=(--tag "$target:$tag"); done
            echo "$variant -> $target ($tags)"
            docker buildx imagetools create "${args[@]}" "$source_image@$digest"
          done
