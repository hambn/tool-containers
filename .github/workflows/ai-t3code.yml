name: ai/t3code

# Moving tags are refreshed when the matching agentbloat base changes or when this
# project changes. A base-only refresh creates no release tag. An inherited CLI or
# T3 release change also creates a primary-image channel tag, for example
# t3code-stable-v0.0.28.
on:
  push:
    branches: [main]
    paths:
      - "images/ai/t3code/images/**"
      - ".github/workflows/ai-t3code.yml"
      - ".github/scripts/registry-inspect.sh"
  schedule:
    - cron: "55 * * * *"
  workflow_dispatch:

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

env:
  THING: ai/t3code
  IMAGE: t3code
  OWNER: ${{ github.repository_owner }}
  PRIMARY: ubuntu-browser
  PKG: t3

jobs:
  plan:
    name: Plan publish candidates
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # Needed to inspect current GHCR image metadata.
    outputs:
      variants: ${{ steps.plan.outputs.variants }}
      build: ${{ steps.plan.outputs.build }}
      t3_version: ${{ steps.plan.outputs.t3_version }}
      t3_channel: ${{ steps.plan.outputs.t3_channel }}
      basedigests: ${{ steps.plan.outputs.basedigests }}
      agent_versions: ${{ steps.plan.outputs.agent_versions }}
      release_tag: ${{ steps.plan.outputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - id: plan
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source .github/scripts/registry-inspect.sh
          image="ghcr.io/$OWNER/$IMAGE"
          variants=(alpine alpine-browser ubuntu ubuntu-browser)
          agent_labels=(codex claude-code cursor-agent grok opencode github-copilot gemini-cli pi-agent acp-agent)

          resolve_base() {
            sed -n 's/^ARG BASE_IMAGE=//p' "images/$THING/images/$1/Dockerfile" | head -n1
          }

          inspect_label() {
            local ref="$1" label="$2" value
            value=$(registry_inspect "$ref" "{{ index .Image.Config.Labels \"io.tool-containers.${label}-version\" }}")
            [ -n "$value" ] && [ "$value" != "<no value>" ] || value=missing
            printf '%s' "$value"
          }

          tag_of() {
            [ "$1" = "$PRIMARY" ] && echo latest || echo "$1"
          }

          t3_version=$(npm view "$PKG" version)
          if grep -qi nightly <<<"$t3_version"; then
            t3_channel=nightly
          else
            t3_channel=stable
          fi

          basedigests='{}'
          agent_versions='{}'
          for variant in "${variants[@]}"; do
            base=$(resolve_base "$variant")
            digest=$(docker buildx imagetools inspect "$base" --format '{{.Manifest.Digest}}')
            basedigests=$(jq --arg variant "$variant" --arg digest "$digest" \
              '. + {($variant): $digest}' <<<"$basedigests")

            labels='{}'
            for label in "${agent_labels[@]}"; do
              version=$(inspect_label "$base" "$label")
              labels=$(jq --arg label "$label" --arg version "$version" \
                '. + {($label): $version}' <<<"$labels")
            done
            agent_versions=$(jq --arg variant "$variant" --argjson labels "$labels" \
              '. + {($variant): $labels}' <<<"$agent_versions")
          done

          selected=()
          release_tag=""
          agent_update=false
          case "$EVENT" in
            workflow_dispatch)
              selected=("${variants[@]}")
              ;;
            push)
              if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
                selected=("${variants[@]}")
              else
                if ! diff=$(git diff --name-only "$BEFORE" "$SHA"); then
                  echo "Unable to compute push diff; refusing to publish" >&2
                  exit 1
                fi
                if grep -q '^\.github/workflows/ai-t3code\.yml$' <<<"$diff" ||
                   grep -q '^\.github/scripts/registry-inspect\.sh$' <<<"$diff"; then
                  selected=("${variants[@]}")
                else
                  for variant in "${variants[@]}"; do
                    grep -q "^images/$THING/images/$variant/" <<<"$diff" && selected+=("$variant") || true
                  done
                fi
              fi
              ;;
            schedule)
              for variant in "${variants[@]}"; do
                previous="${image}:$(tag_of "$variant")"
                current_digest=$(jq -r --arg variant "$variant" '.[$variant]' <<<"$basedigests")
                old_digest=$(registry_inspect "$previous" '{{ index .Image.Config.Labels "io.tool-containers.base-digest" }}')
                if [ "$current_digest" != "$old_digest" ]; then
                  echo "$variant base: $old_digest -> $current_digest"
                  selected+=("$variant")
                fi

                old_t3=$(registry_inspect "$previous" '{{ index .Image.Config.Labels "io.tool-containers.t3-version" }}')
                if [ "$old_t3" != "$t3_version" ]; then
                  echo "$variant t3: $old_t3 -> $t3_version"
                  selected+=("$variant")
                fi

                for label in "${agent_labels[@]}"; do
                  current_agent=$(jq -r --arg variant "$variant" --arg label "$label" \
                    '.[$variant][$label]' <<<"$agent_versions")
                  old_agent=$(registry_inspect "$previous" "{{ index .Image.Config.Labels \"io.tool-containers.${label}-version\" }}")
                  if [ "$current_agent" != "$old_agent" ]; then
                    echo "$variant $label: $old_agent -> $current_agent"
                    selected+=("$variant")
                    agent_update=true
                  fi
                done
              done
              ;;
            *)
              echo "unsupported event: $EVENT" >&2
              exit 1
              ;;
          esac

          selected_json=$(printf '%s\n' "${selected[@]}" | sed '/^$/d' | jq -R . | jq -cs 'unique')
          if [ "$agent_update" = true ] || [ "$EVENT" = schedule ]; then
            # Only the primary image receives the channel/version release tag. This
            # avoids collisions between the four profiles while all moving tags update.
            for variant in "${variants[@]}"; do
              previous="${image}:$(tag_of "$variant")"
              old_t3=$(registry_inspect "$previous" '{{ index .Image.Config.Labels "io.tool-containers.t3-version" }}')
              [ "$old_t3" != "$t3_version" ] && release_tag="t3code-${t3_channel}-v${t3_version}" && break
            done
          fi

          echo "Will build: $selected_json"
          {
            echo "variants=$selected_json"
            echo "basedigests=$(jq -c . <<<"$basedigests")"
            echo "agent_versions=$(jq -c . <<<"$agent_versions")"
            echo "t3_version=$t3_version"
            echo "t3_channel=$t3_channel"
            echo "release_tag=$release_tag"
            if [ "$selected_json" = "[]" ]; then echo "build=false"; else echo "build=true"; fi
          } >>"$GITHUB_OUTPUT"

  build:
    name: Build and scan ${{ matrix.variant }}
    needs: plan
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # Needed to push the untagged digest for validation.
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON(needs.plan.outputs.variants) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: images/${{ env.THING }}/images/${{ matrix.variant }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository_owner }}/agentbloat:${{ matrix.variant }}@${{ fromJSON(needs.plan.outputs.basedigests)[matrix.variant] }}
            T3_VERSION=${{ needs.plan.outputs.t3_version }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            io.tool-containers.variant=${{ matrix.variant }}
            io.tool-containers.t3-version=${{ needs.plan.outputs.t3_version }}
            io.tool-containers.t3-channel=${{ needs.plan.outputs.t3_channel }}
            io.tool-containers.base-digest=${{ fromJSON(needs.plan.outputs.basedigests)[matrix.variant] }}
            io.tool-containers.codex-version=${{ fromJSON(needs.plan.outputs.agent_versions)[matrix.variant].codex }}
            io.tool-containers.claude-code-version=${{ fromJSON(needs.plan.outputs.agent_versions)[matrix.variant]['claude-code'] }}
            io.tool-containers.cursor-agent-version=${{ fromJSON(needs.plan.outputs.agent_versions)[matrix.variant]['cursor-agent'] }}
            io.tool-containers.grok-version=${{ fromJSON(needs.plan.outputs.agent_versions)[matrix.variant].grok }}
            io.tool-containers.opencode-version=${{ fromJSON(needs.plan.outputs.agent_versions)[matrix.variant].opencode }}
            io.tool-containers.github-copilot-version=${{ fromJSON(needs.plan.outputs.agent_versions)[matrix.variant]['github-copilot'] }}
            io.tool-containers.gemini-cli-version=${{ fromJSON(needs.plan.outputs.agent_versions)[matrix.variant]['gemini-cli'] }}
            io.tool-containers.pi-agent-version=${{ fromJSON(needs.plan.outputs.agent_versions)[matrix.variant]['pi-agent'] }}
            io.tool-containers.acp-agent-version=${{ fromJSON(needs.plan.outputs.agent_versions)[matrix.variant]['acp-agent'] }}
          outputs: type=image,name=ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }},push-by-digest=true,push=true
          cache-from: type=gha,scope=${{ env.IMAGE }}-${{ matrix.variant }}
          cache-to: type=gha,mode=max,scope=${{ env.IMAGE }}-${{ matrix.variant }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true
        env:
          TRIVY_SKIP_FILES: "**/usr/local/bin/gh,**/usr/local/bin/glab,**/usr/local/bin/helm,**/usr/local/bin/kubectl,**/usr/local/bin/kustomize,**/usr/local/bin/yq,**/usr/local/bin/uv,**/usr/local/bin/uvx,**/usr/local/bin/node,**/usr/local/lib/node_modules/npm/node_modules/**,**/usr/bin/tailscale,**/usr/bin/tailscaled,**/usr/local/go/**,**/usr/local/lib/node_modules/@github/copilot/**"

      - name: Trivy secret scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          scanners: secret
          exit-code: "1"

      - name: Save digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "$VARIANT" =~ ^[a-z0-9][a-z0-9._-]*$ ]]
          mkdir -p /tmp/digests
          printf '%s\n' "$DIGEST" >"/tmp/digests/$VARIANT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.variant }}
          path: /tmp/digests/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 1

  push:
    name: Publish to ${{ matrix.registry }}
    needs: [plan, build]
    if: needs.plan.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: ${{ matrix.registry }}
    permissions:
      packages: write # Needed to promote the validated digest to GHCR tags.
    strategy:
      fail-fast: false
      matrix:
        registry: [ghcr, dockerhub]
    steps:
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests

      - name: Login GHCR
        if: matrix.registry == 'ghcr'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Login Docker Hub
        if: matrix.registry == 'dockerhub'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: "${{ secrets.DOCKERHUB_USERNAME }}"
          password: "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Publish moving and release tags
        env:
          VARIANTS: ${{ needs.plan.outputs.variants }}
          RELEASE_TAG: ${{ needs.plan.outputs.release_tag }}
          DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
          REGISTRY: ${{ matrix.registry }}
        run: |
          set -euo pipefail
          source_image="ghcr.io/$OWNER/$IMAGE"
          case "$REGISTRY" in
            ghcr) target="$source_image" ;;
            dockerhub) target="docker.io/$DOCKERHUB_USER/$IMAGE" ;;
          esac

          check_immutable() {
            local ref="$1" expected="$2" output status
            output=$(docker buildx imagetools inspect "$ref" --format '{{.Manifest.Digest}}' 2>&1) && {
              [ "$output" = "$expected" ] || { echo "Immutable tag collision: $ref" >&2; return 1; }; return 0; }
            status=$?; grep -Eiq 'manifest[[:space:]]+unknown|MANIFEST_UNKNOWN|NAME_UNKNOWN|status code: 404|not found' <<<"$output" && return 0
            echo "Registry inspection failed for $ref: $output" >&2; return "$status"
          }

          for variant in $(jq -r '.[]' <<<"$VARIANTS"); do
            digest=$(cat "/tmp/digests/$variant")
            tags="$variant"
            [ "$variant" = "$PRIMARY" ] && tags="latest $tags"
            [ "$variant" = "$PRIMARY" ] && [ -n "$RELEASE_TAG" ] && tags="$tags $RELEASE_TAG"
            [ "$variant" = "$PRIMARY" ] && [ -n "$RELEASE_TAG" ] && \
              check_immutable "$target:$RELEASE_TAG" "$digest"

            args=()
            for tag in $tags; do args+=(--tag "$target:$tag"); done
            echo "$variant -> $target ($tags)"
            docker buildx imagetools create "${args[@]}" "$source_image@$digest"
          done
