name: ai/pi-agent

on:
  pull_request:
    paths: &paths
      - "tools/ai/pi-agent/**"
      - "tools/trivyignore.yaml"
      - ".github/workflows/ai-pi-agent.yml"
      - ".github/workflows/tool-image.yml"
  push:
    branches: [main]
    paths: *paths
  # Daily check: rebuilds variants whose parent moved or whose published image has
  # fixable OS vulnerabilities.
  schedule:
    - cron: "45 6 * * *"
  # The parent's workflow dispatches this one with outdated-only after publishing.
  workflow_dispatch:
    inputs:
      outdated-only:
        description: Only rebuild variants whose parent moved or that have fixable OS vulnerabilities.
        type: boolean
        default: false

concurrency:
  group: ai-pi-agent-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  image:
    name: pi-agent
    permissions:
      contents: read
      packages: write
      security-events: write
      id-token: write
      actions: write
    uses: ./.github/workflows/tool-image.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    with:
      tool: tools/ai/pi-agent
      tags: |
        # Stable variant tags; latest is the lightest Ubuntu variant, which also
        # carries the upstream version.
        echo "$VARIANT"
        if [ "$VARIANT" = ubuntu ]; then
            echo latest
            echo "pi-agent-$VERSION"
        fi
      version-arg: PI_VERSION
      outdated-only: ${{ inputs.outdated-only || false }}
