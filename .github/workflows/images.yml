name: images

# Discover affected targets from Bake, then build, test, and scan each image on
# native runners. Only main publishes the verified digests as multi-arch images.
on:
  pull_request:
    paths: &image-paths
      - "docker-bake.hcl"
      - "versions.hcl"
      - "tools/**"
      - ".trivyignore.yaml"
      - ".github/workflows/images.yml"
      - ".github/scripts/plan.py"
      - ".github/scripts/bake-env.sh"
      - ".github/scripts/publish.sh"
  push:
    branches: [main]
    paths: *image-paths
  workflow_dispatch:
    inputs:
      targets:
        description: Space-separated published bake targets or groups (see docker-bake.hcl).
        required: true
        default: all
        type: string

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  plan:
    name: Plan image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker # Planning only renders local Bake files.
      - name: Plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DISPATCH_TARGETS: ${{ inputs.targets }}
        run: python3 .github/scripts/plan.py

  build:
    name: Build and test ${{ matrix.target }} (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # Needed to push digests and cache when publishing.
      security-events: write # Needed to upload Trivy SARIF.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      PLATFORM: linux/${{ matrix.arch }}
      TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        if: env.TRUSTED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export bake variables
        run: .github/scripts/bake-env.sh

      - name: Read target metadata
        id: meta
        run: |
          set -euo pipefail
          docker buildx bake -f docker-bake.hcl -f versions.hcl --print "$TARGET" |
              jq -r --arg t "$TARGET" '.target[$t] | [
                  "context=\(.context)",
                  "repo=\(.tags[0] | split("/")[-1] | split(":")[0])",
                  "distro=\(.labels["io.github.hambn.containers.distro"])",
                  "tier=\(.labels["io.github.hambn.containers.tier"])",
                  "variant=\(.labels["io.github.hambn.containers.variant"])"
              ] | .[]' >>"$GITHUB_OUTPUT"

      - name: Install container-structure-test
        timeout-minutes: 2
        run: |
          set -euo pipefail
          case "$ARCH" in
              amd64) sha=fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca ;;
              arm64) sha=801826ed107222120eb6df8c143b7de752cfebbe3aebfeea576e7098486917c2 ;;
          esac
          curl -fsSLo /tmp/cst "https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-$ARCH"
          echo "$sha  /tmp/cst" | sha256sum -c -
          sudo install -m 0755 /tmp/cst /usr/local/bin/container-structure-test

      # JavaScript actions receive the runtime credentials needed by BuildKit's
      # GHA cache backend; ordinary shell steps do not. Keep PR caches scoped by
      # GitHub's ref isolation, including for forks.
      - name: Enable pull request build cache
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name}`);
              if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(name, value);
            }

      - name: Build and load
        timeout-minutes: 45
        env:
          PR_BUILD: ${{ github.event_name == 'pull_request' }}
        run: |
          set -euo pipefail
          cache=()
          if [ "$PR_BUILD" = true ]; then
              cache+=(--set "$TARGET.cache-from+=type=gha,version=2,scope=$TARGET-$ARCH")
              cache+=(--set "$TARGET.cache-to=type=gha,version=2,scope=$TARGET-$ARCH,mode=max,timeout=5m,ignore-error=true")
          fi
          docker buildx bake -f docker-bake.hcl -f versions.hcl "$TARGET" "${cache[@]}" \
              --provenance=false \
              --set "$TARGET.output=type=docker,rewrite-timestamp=true" \
              --set "$TARGET.tags=local/$TARGET:test"

      - name: Structure tests
        timeout-minutes: 5
        env:
          TOOL_DIR: ${{ steps.meta.outputs.context }}
          DISTRO: ${{ steps.meta.outputs.distro }}
          TIER: ${{ steps.meta.outputs.tier }}
          VARIANT: ${{ steps.meta.outputs.variant }}
        run: |
          set -euo pipefail
          configs=(--config "$TOOL_DIR/tests/structure.yaml")
          for name in $(printf '%s\n' "$DISTRO" "$TIER" "$VARIANT" | awk '!seen[$0]++'); do
              file="$TOOL_DIR/tests/structure-$name.yaml"
              if [ -f "$file" ]; then configs+=(--config "$file"); fi
          done
          container-structure-test test --image "local/$TARGET:test" --platform "$PLATFORM" "${configs[@]}"

      - name: Smoke test
        timeout-minutes: 5
        env:
          TOOL_DIR: ${{ steps.meta.outputs.context }}
          DISTRO: ${{ steps.meta.outputs.distro }}
          TIER: ${{ steps.meta.outputs.tier }}
          VARIANT: ${{ steps.meta.outputs.variant }}
        run: |
          set -euo pipefail
          if [ -x "$TOOL_DIR/tests/smoke.sh" ]; then
              "$TOOL_DIR/tests/smoke.sh" "local/$TARGET:test"
          else
              echo "No smoke test for $TOOL_DIR"
          fi

      - name: Trivy SARIF report
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.target }}:test
          scanners: vuln,secret
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: sarif
          output: trivy.sarif

      # Gate on everything the repository controls. Statically linked upstream
      # binaries only get fixes from new upstream releases (Renovate bumps them); the
      # SARIF report above still includes them for Code scanning.
      - name: Trivy gate
        if: matrix.arch == 'amd64'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: local/${{ matrix.target }}:test
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          trivyignores: .trivyignore.yaml
          skip-setup-trivy: true
          skip-files: "**/usr/local/bin/gh,**/usr/local/bin/glab,**/usr/local/bin/helm,**/usr/local/bin/kubectl,**/usr/local/bin/kustomize,**/usr/local/bin/yq,**/usr/local/bin/uv,**/usr/local/bin/uvx,**/usr/local/bin/node,**/usr/local/lib/node_modules/npm/node_modules/**,**/usr/local/bin/tailscale,**/usr/local/sbin/tailscaled,**/usr/local/go/**,**/usr/local/lib/node_modules/@github/copilot/**,**/usr/local/lib/node_modules/@alibaba-group/**"

      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && matrix.arch == 'amd64' && env.TRUSTED == 'true' && hashFiles('trivy.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy.sarif
          category: trivy-${{ matrix.target }}

      - name: Push by digest
        if: needs.plan.outputs.publish == 'true'
        env:
          CACHE_WRITE: "true"
          REPO: ${{ steps.meta.outputs.repo }}
        run: |
          set -euo pipefail
          docker buildx bake -f docker-bake.hcl -f versions.hcl "$TARGET" \
              --provenance=mode=max --sbom=true \
              --metadata-file /tmp/metadata.json \
              --set "$TARGET.tags=" \
              --set "$TARGET.output=type=image,name=ghcr.io/hambn/$REPO,push-by-digest=true,name-canonical=true,push=true,rewrite-timestamp=true"
          digest=$(jq -r --arg t "$TARGET" '.[$t]["containerimage.digest"]' /tmp/metadata.json)
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p /tmp/digests
          printf '%s\n' "$digest" >"/tmp/digests/$TARGET-$ARCH"

      - name: Upload digest
        if: needs.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.target }}-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.target }}-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.target }}
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub
    permissions:
      contents: read
      packages: write # Needed to create GHCR tags and push signatures and attestations.
      id-token: write # Needed for keyless cosign signing and provenance attestations.
      attestations: write # Needed to record provenance attestations.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker # Manifest operations do not need a BuildKit container.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true
          path: /tmp/digests
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Export bake variables
        run: .github/scripts/bake-env.sh

      - name: Create and mirror the multi-arch index
        id: publish
        env:
          TARGET: ${{ matrix.target }}
        run: .github/scripts/publish.sh "$TARGET" /tmp/digests

      - name: Sign
        env:
          REPO: ${{ steps.publish.outputs.repo }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/hambn/$REPO@$DIGEST"
          cosign sign --yes "docker.io/hambn/$REPO@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/hambn/${{ steps.publish.outputs.repo }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
