name: Test and build

# Plan the affected Bake targets, then test and build every tool on native amd64
# and arm64 runners: one job per tool and architecture, covering all of the tool's
# selected variants. Only main publishes the verified digests as multi-arch images.
on:
  pull_request:
    paths: &image-paths
      - "docker-bake.hcl"
      - "versions.hcl"
      - "tools/**"
      - ".trivyignore.yaml"
      - ".github/workflows/images.yml"
      - ".github/scripts/plan.py"
      - ".github/scripts/bake-env.sh"
      - ".github/scripts/build-tool.sh"
      - ".github/scripts/publish.sh"
  push:
    branches: [main]
    paths: *image-paths
  workflow_dispatch:
    inputs:
      targets:
        description: Space-separated published bake targets or groups (see docker-bake.hcl).
        required: true
        default: all
        type: string

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  plan:
    name: Plan image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      tools: ${{ steps.plan.outputs.tools }}
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker # Planning only renders local Bake files.
      - name: Plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DISPATCH_TARGETS: ${{ inputs.targets }}
        run: python3 .github/scripts/plan.py

  test-and-build:
    name: ${{ matrix.tool.name }} (${{ matrix.arch }})
    needs: plan
    if: needs.plan.outputs.targets != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write # Needed to push digests and cache when publishing.
      security-events: write # Needed to upload Trivy SARIF.
    strategy:
      fail-fast: false
      matrix:
        tool: ${{ fromJSON(needs.plan.outputs.tools) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-24.04
            cst-sha256: fa35e89512a8978585f76cf41397956d2e3a30c62c2ad3fb857b1597074d14ca
          - arch: arm64
            runner: ubuntu-24.04-arm
            cst-sha256: 801826ed107222120eb6df8c143b7de752cfebbe3aebfeea576e7098486917c2
    env:
      TARGETS: ${{ toJSON(matrix.tool.targets) }}
      ARCH: ${{ matrix.arch }}
      SCAN: ${{ matrix.arch == 'amd64' }}
      PR_BUILD: ${{ github.event_name == 'pull_request' }}
      PUBLISH: ${{ needs.plan.outputs.publish }}
      TRUSTED: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      RESULT_DIR: /tmp/image-results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        if: env.TRUSTED == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Export bake variables
        run: .github/scripts/bake-env.sh

      - name: Install container-structure-test
        timeout-minutes: 2
        env:
          CST_SHA256: ${{ matrix.cst-sha256 }}
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/cst "https://github.com/GoogleContainerTools/container-structure-test/releases/download/v1.22.1/container-structure-test-linux-$ARCH"
          echo "$CST_SHA256  /tmp/cst" | sha256sum -c -
          sudo install -m 0755 /tmp/cst /usr/local/bin/container-structure-test
      - uses: aquasecurity/setup-trivy@3fb12ec12f41e471780db15c232d5dd185dcb514 # v0.2.6
        if: env.SCAN == 'true'
        with:
          version: v0.70.0
          cache: true

      # JavaScript actions receive the runtime credentials needed by BuildKit's
      # GHA cache backend; ordinary shell steps do not. PR caches use ref isolation.
      - name: Enable pull request build cache
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        with:
          script: |
            for (const name of ['ACTIONS_RUNTIME_TOKEN', 'ACTIONS_RESULTS_URL']) {
              const value = process.env[name];
              if (!value) throw new Error(`Missing ${name}`);
              if (name === 'ACTIONS_RUNTIME_TOKEN') core.setSecret(value);
              core.exportVariable(name, value);
            }

      - name: Test and build
        run: .github/scripts/build-tool.sh

      - name: Find scan reports
        id: reports
        if: ${{ !cancelled() }}
        run: |
          if compgen -G "$RESULT_DIR/sarif/*.sarif" >/dev/null; then
              echo 'present=true' >>"$GITHUB_OUTPUT"
          fi
      - name: Upload Trivy SARIF
        if: ${{ !cancelled() && env.TRUSTED == 'true' && steps.reports.outputs.present == 'true' }}
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: /tmp/image-results/sarif

      - name: Upload digests
        if: needs.plan.outputs.publish == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.tool.artifact }}-${{ matrix.arch }}
          path: /tmp/image-results/digests/*
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish ${{ matrix.target }}
    needs: [plan, test-and-build]
    if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.targets != '[]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub
    permissions:
      contents: read
      packages: write # Needed to create GHCR tags and push signatures and attestations.
      id-token: write # Needed for keyless cosign signing and provenance attestations.
      attestations: write # Needed to record provenance attestations.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker # Manifest operations do not need a BuildKit container.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          merge-multiple: true
          path: /tmp/digests
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Export bake variables
        run: .github/scripts/bake-env.sh

      - name: Create and mirror the multi-arch index
        id: publish
        env:
          TARGET: ${{ matrix.target }}
        run: .github/scripts/publish.sh "$TARGET" /tmp/digests

      - name: Sign
        env:
          REPO: ${{ steps.publish.outputs.repo }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/hambn/$REPO@$DIGEST"
          cosign sign --yes "docker.io/hambn/$REPO@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/hambn/${{ steps.publish.outputs.repo }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
