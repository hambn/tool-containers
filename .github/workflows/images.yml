name: images

# The only image pipeline. plan.py selects the affected published bake targets and
# groups them into dependency waves; each wave builds, tests, and scans on native
# amd64 and arm64 runners. On main, publish merges the per-arch digests into
# multi-arch indexes on GHCR, copies them to Docker Hub, then signs and attests.
on:
  pull_request:
    paths: &image-paths
      - "docker-bake.hcl"
      - "versions.hcl"
      - "tools/**"
      - ".trivyignore.yaml"
      - ".github/workflows/images.yml"
      - ".github/workflows/image-build.yml"
      - ".github/scripts/plan.py"
      - ".github/scripts/bake-env.sh"
      - ".github/scripts/publish.sh"
  push:
    branches: [main]
    paths: *image-paths
  workflow_dispatch:
    inputs:
      targets:
        description: Space-separated published bake targets or groups (see docker-bake.hcl).
        required: true
        default: all
        type: string

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  plan:
    name: Plan image builds
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      targets: ${{ steps.plan.outputs.targets }}
      wave_1: ${{ steps.plan.outputs.wave_1 }}
      wave_2: ${{ steps.plan.outputs.wave_2 }}
      wave_3: ${{ steps.plan.outputs.wave_3 }}
      has_wave_1: ${{ steps.plan.outputs.has_wave_1 }}
      has_wave_2: ${{ steps.plan.outputs.has_wave_2 }}
      has_wave_3: ${{ steps.plan.outputs.has_wave_3 }}
      publish: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Plan
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          DISPATCH_TARGETS: ${{ inputs.targets }}
        run: python3 .github/scripts/plan.py

  build-1:
    name: Build wave 1
    needs: plan
    if: needs.plan.outputs.has_wave_1 == 'true'
    permissions:
      contents: read
      packages: write # Needed to push digests and cache when publishing.
      security-events: write # Needed to upload Trivy SARIF.
    uses: ./.github/workflows/image-build.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    with:
      targets: ${{ needs.plan.outputs.wave_1 }}
      publish: ${{ needs.plan.outputs.publish == 'true' }}

  build-2:
    name: Build wave 2
    needs: [plan, build-1]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.has_wave_2 == 'true' }}
    permissions:
      contents: read
      packages: write # Needed to push digests and cache when publishing.
      security-events: write # Needed to upload Trivy SARIF.
    uses: ./.github/workflows/image-build.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    with:
      targets: ${{ needs.plan.outputs.wave_2 }}
      publish: ${{ needs.plan.outputs.publish == 'true' }}

  build-3:
    name: Build wave 3
    needs: [plan, build-1, build-2]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.has_wave_3 == 'true' }}
    permissions:
      contents: read
      packages: write # Needed to push digests and cache when publishing.
      security-events: write # Needed to upload Trivy SARIF.
    uses: ./.github/workflows/image-build.yml # zizmor: ignore[self-repository] actionlint rejects the $/ form
    with:
      targets: ${{ needs.plan.outputs.wave_3 }}
      publish: ${{ needs.plan.outputs.publish == 'true' }}

  publish:
    name: Publish ${{ matrix.target }}
    needs: [plan, build-1, build-2, build-3]
    if: ${{ !failure() && !cancelled() && needs.plan.outputs.publish == 'true' && needs.plan.outputs.targets != '[]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: dockerhub
    permissions:
      contents: read
      packages: write # Needed to create GHCR tags and push signatures and attestations.
      id-token: write # Needed for keyless cosign signing and provenance attestations.
      attestations: write # Needed to record provenance attestations.
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJSON(needs.plan.outputs.targets) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-${{ matrix.target }}-*
          merge-multiple: true
          path: /tmp/digests
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Export bake variables
        run: .github/scripts/bake-env.sh

      - name: Create and mirror the multi-arch index
        id: publish
        env:
          TARGET: ${{ matrix.target }}
        run: .github/scripts/publish.sh "$TARGET" /tmp/digests

      - name: Sign
        env:
          REPO: ${{ steps.publish.outputs.repo }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          set -euo pipefail
          cosign sign --yes "ghcr.io/hambn/$REPO@$DIGEST"
          cosign sign --yes "docker.io/hambn/$REPO@$DIGEST"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/hambn/${{ steps.publish.outputs.repo }}
          subject-digest: ${{ steps.publish.outputs.digest }}
          push-to-registry: true
