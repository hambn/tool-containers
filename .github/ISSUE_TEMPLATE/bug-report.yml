name: Bug report
description: Report a reproducible image, deployment, or automation defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve the repository. Do not include secrets.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Image build or runtime
        - Deployment example
        - Publishing or repository automation
        - Documentation
        - Repository tooling
        - Other
    validations:
      required: true
  - type: input
    id: target
    attributes:
      label: Affected image, tag, or workflow
      description: Include an image reference or the workflow name and run URL, as applicable.
      placeholder: ghcr.io/hambn/agentimg:ubuntu-browser or base/agentimg run URL
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Current behavior
      description: Describe what happened, including the exact error when useful.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Describe what should have happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Provide the smallest safe command, deployment, or workflow run that reproduces the issue.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include the container runtime or runner, host OS, architecture, and relevant versions.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste the smallest useful, redacted log excerpt. Do not include credentials.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and removed credentials and private data.
          required: true
