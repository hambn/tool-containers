# WORKSPACE="$PWD" ./compose.sh run --rm shell
name: core

services:
  shell:
    image: ${CORE_IMAGE:-ghcr.io/hambn/core:wolfi}
    working_dir: /workspace
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stdin_open: true
    tty: true
