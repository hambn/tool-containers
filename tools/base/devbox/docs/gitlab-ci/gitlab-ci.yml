# Add this job to your project's .gitlab-ci.yml and replace the check commands with your own.
devbox-check:
  image: ghcr.io/hambn/devbox:ubuntu-full
  timeout: 30m
  script:
    # The runner clones as a different user than sysadmin, so Git needs the path marked safe.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - go version
    - node --version
    - python3 --version
