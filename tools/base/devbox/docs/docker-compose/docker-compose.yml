# WORKSPACE="$PWD" ./compose.sh run --rm devbox
name: devbox

services:
  devbox:
    image: ${DEVBOX_IMAGE:-ghcr.io/hambn/devbox:ubuntu-full}
    working_dir: /workspace
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
      - home:/home/sysadmin
    shm_size: 1g
    stdin_open: true
    tty: true

volumes:
  home:
