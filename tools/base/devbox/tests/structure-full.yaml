schemaVersion: 2.0.0

fileExistenceTests:
  - name: kubectl zsh completion
    path: /usr/local/share/zsh/site-functions/_kubectl
    shouldExist: true
  - name: workspace owned by sysadmin
    path: /workspace
    shouldExist: true
    uid: 1000
    gid: 1000

commandTests:
  - name: full commands
    command: /bin/zsh
    args:
      - -lc
      - |
        for tool in aria2c autoconf automake bash bison brotli bwrap bzip2 cmake curl dialog dig \
          docker envsubst fakeroot fd ffmpeg flex fzf gh git git-lfs glab go gpg helm hg htop http \
          infocmp iperf3 jq kubectl kustomize make man mitmproxy mtr nano nginx ninja nmap node \
          nodejs npm npx nvim parallel patch pipx pkg-config pnpm ps python3 rg rsync shellcheck \
          shfmt ssh strace sudo tailscale tailscaled tcpdump tmux traceroute uv uvx whois xz \
          yamllint yarn yq zip zsh zstd; do
          command -v "$tool" >/dev/null || { echo "missing: $tool" >&2; exit 1; }
        done
  - name: tool versions run
    command: /bin/zsh
    args:
      - -lc
      - |
        set -e
        gh --version
        glab --version
        go version
        node --version
        npm --version
        pnpm --version
        yarn --version
        uv --version
        helm version --short
        kustomize version
        yq --version
        tailscale version
        kubectl version --client=true --output=yaml
        git lfs version
  - name: docker CLI plugins
    command: /bin/zsh
    args: ["-lc", "docker --version && docker buildx version && docker compose version"]
  - name: kubectl alias
    command: /bin/zsh
    args: ["-lic", "alias k"]
    expectedOutput: ["k=kubectl"]
  - name: sysadmin in docker group
    command: id
    args: ["-nG"]
    expectedOutput: ["\\bdocker\\b"]
