# docker stack deploy -c stack.yml workspace
version: "3.8"

services:
  workspace:
    image: ghcr.io/hambn/workspace:ubuntu-24.04-full
    user: "1000:1000"
    cap_drop: [ALL]
    command: ["sleep", "infinity"]
    networks: [workspace]
    volumes:
      - workspace:/workspace
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      resources:
        limits:
          cpus: "2.0"
          memory: 4G

networks:
  workspace:
    driver: overlay
    name: workspace

volumes:
  workspace:
