# WORKSPACE="$PWD" ./compose.sh run --rm open-code-review
name: open-code-review

services:
  open-code-review:
    image: ${OPEN_CODE_REVIEW_IMAGE:-ghcr.io/hambn/open-code-review:ubuntu-browser}
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    stdin_open: true
    tty: true
