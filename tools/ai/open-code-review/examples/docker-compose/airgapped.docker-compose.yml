# Offline: docker load -i open-code-review.tar first, then
# WORKSPACE="$PWD" ./compose.sh -f airgapped.docker-compose.yml run --rm open-code-review
name: open-code-review

services:
  open-code-review:
    image: ghcr.io/hambn/open-code-review:ubuntu-browser
    pull_policy: never
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    stdin_open: true
    tty: true
