schemaVersion: 2.0.0

metadataTest:
  user: sysadmin
  workdir: /workspace
  entrypoint: ["ocr"]

commandTests:
  - name: runs as sysadmin (uid 1000)
    command: id
    args: [-u]
    expectedOutput: ["(?m)^1000\\n?$"]
  - name: node and npm are inherited
    command: bash
    args: [-c, node --version && npm --version]
  - name: ocr is on PATH
    command: bash
    args: [-c, command -v ocr]
