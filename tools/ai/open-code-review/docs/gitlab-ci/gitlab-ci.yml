# Add this job to your project's .gitlab-ci.yml and set a masked ANTHROPIC_API_KEY and an OCR_MODEL CI/CD variable.
open-code-review:
  image:
    name: ghcr.io/hambn/open-code-review:ubuntu
    # The runner passes a shell as the command, so clear the image's CLI entrypoint.
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # A full clone keeps the merge request's diff base commit available.
    GIT_DEPTH: "0"
  timeout: 30m
  script:
    # The runner clones as a different user than sysadmin, so Git needs the path marked safe.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - ': "${ANTHROPIC_API_KEY:?Set ANTHROPIC_API_KEY as a masked CI/CD variable}"'
    - ': "${OCR_MODEL:?Set OCR_MODEL as a CI/CD variable}"'
    # ocr reads the provider and model from its config and the key from ANTHROPIC_API_KEY.
    - ocr config set provider anthropic
    - ocr config set model "$OCR_MODEL"
    - ocr review --from "$CI_MERGE_REQUEST_DIFF_BASE_SHA" --to HEAD
