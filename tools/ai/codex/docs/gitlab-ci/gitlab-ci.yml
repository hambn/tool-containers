# Add this job to your project's .gitlab-ci.yml and set CODEX_API_KEY as a masked CI/CD variable.
codex-review:
  image:
    name: ghcr.io/hambn/codex:ubuntu
    # The runner passes a shell as the command, so clear the image's CLI entrypoint.
    entrypoint: [""]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  variables:
    # A full clone keeps the merge request's diff base commit available.
    GIT_DEPTH: "0"
  timeout: 30m
  script:
    # The runner clones as a different user than sysadmin, so Git needs the path marked safe.
    - git config --global --add safe.directory "$CI_PROJECT_DIR"
    - ': "${CODEX_API_KEY:?Set CODEX_API_KEY as a masked CI/CD variable}"'
    # Codex's own sandbox may not work inside a container; the job container isolates it.
    - git diff "$CI_MERGE_REQUEST_DIFF_BASE_SHA" HEAD | codex exec --sandbox danger-full-access "Review this merge request diff for bugs, security issues, and missing tests."
