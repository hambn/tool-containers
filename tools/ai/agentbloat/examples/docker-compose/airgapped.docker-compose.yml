# Offline: docker load -i agentbloat.tar first, then
# WORKSPACE="$PWD" ./compose.sh -f airgapped.docker-compose.yml run --rm agentbloat
name: agentbloat

services:
  agentbloat:
    image: ghcr.io/hambn/agentbloat:ubuntu-browser
    pull_policy: never
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    stdin_open: true
    tty: true
