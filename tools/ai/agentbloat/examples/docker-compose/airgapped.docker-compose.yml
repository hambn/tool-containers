# WORKSPACE="$PWD" ./compose.sh -f airgapped.docker-compose.yml run --rm agentbloat
name: agentbloat-airgapped

services:
  agentbloat:
    image: ghcr.io/hambn/agentbloat:ubuntu-24.04
    pull_policy: never
    command: ["bash", "-l"]
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    stdin_open: true
    tty: true
    networks: [agentbloat]

networks:
  agentbloat:
    name: agentbloat-airgapped
