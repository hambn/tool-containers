# WORKSPACE="$PWD" ./compose.sh -f airgapped.docker-compose.yml run --rm pi-agent
name: pi-agent-airgapped

services:
  pi-agent:
    image: ghcr.io/hambn/pi-agent:ubuntu-24.04
    pull_policy: never
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    stdin_open: true
    tty: true
    networks: [pi-agent]

networks:
  pi-agent:
    name: pi-agent-airgapped
