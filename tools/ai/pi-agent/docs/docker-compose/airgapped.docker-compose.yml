# Offline: docker load -i pi-agent.tar first, then
# WORKSPACE="$PWD" ./compose.sh -f airgapped.docker-compose.yml run --rm pi-agent
name: pi-agent

services:
  pi-agent:
    image: ${PI_AGENT_IMAGE:-ghcr.io/hambn/pi-agent:ubuntu-browser}
    pull_policy: never
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    stdin_open: true
    tty: true
