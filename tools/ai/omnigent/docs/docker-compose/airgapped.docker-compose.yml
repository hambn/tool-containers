# Offline: docker load -i omnigent.tar first, then
# WORKSPACE="$PWD" ./compose.sh -f airgapped.docker-compose.yml run --rm omnigent
name: omnigent

services:
  omnigent:
    image: ghcr.io/hambn/omnigent:ubuntu-browser
    pull_policy: never
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    stdin_open: true
    tty: true
