# WORKSPACE="$PWD" ./compose.sh -f airgapped.docker-compose.yml run --rm omnigent
name: omnigent-airgapped

services:
  omnigent:
    image: ghcr.io/hambn/omnigent:ubuntu-24.04
    pull_policy: never
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    stdin_open: true
    tty: true
    networks: [omnigent]

networks:
  omnigent:
    name: omnigent-airgapped
