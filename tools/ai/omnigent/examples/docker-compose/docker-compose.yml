# WORKSPACE="$PWD" ./compose.sh run --rm omnigent
name: omnigent

services:
  omnigent:
    image: ${OMNIGENT_IMAGE:-ghcr.io/hambn/omnigent:ubuntu-24.04}
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    stdin_open: true
    tty: true
    networks: [omnigent]

networks:
  omnigent:
    name: omnigent
