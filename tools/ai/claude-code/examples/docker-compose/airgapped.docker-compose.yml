# Offline: docker load -i claude-code.tar first, then
# WORKSPACE="$PWD" ./compose.sh -f airgapped.docker-compose.yml run --rm claude
name: claude-code

services:
  claude:
    image: ghcr.io/hambn/claude-code:ubuntu-browser
    pull_policy: never
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?set ANTHROPIC_API_KEY}
    volumes:
      - ${WORKSPACE:?Set WORKSPACE to an absolute host path}:/workspace
    stdin_open: true
    tty: true
